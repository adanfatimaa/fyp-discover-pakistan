<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginPage</title>
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- stylesheet -->
    <link rel="stylesheet" href="login.css" />
    <link rel="stylesheet" href="common.css" />
    
</head>
<body>
     <div id="navbar"></div>

    <!-- login container -->
     <div class="login-container">
        <div class="login-header">
            <h1>Continue Your Adventure</h1>
            <p>Log in to continue your journey through Pakistan.</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="yourname@gmail.com" required>
            </div>
                
           <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <span class="toggle-password" onclick="togglePassword('password', this)">👁️</span>
                </div>
                <a href="forgot-password.html" style="font-size:13px; color:#6b8f3e; text-decoration:none; float:right; margin-top:4px;">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

    <script src="login.js"></script>
    <script src="common.js"></script>
</body>
</html>
