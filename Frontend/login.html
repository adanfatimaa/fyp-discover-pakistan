<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- stylesheet -->
    <link rel="stylesheet" href="login.css" />
    <link rel="stylesheet" href="common.css" />
</head>
<body>
     <!-- Navigation Bar -->

    <nav class="navbar" id="navbar">
      <div class="logo">Discover<br />Pakistan</div>
      <!-- hamburger menu for smaller screens -->
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <ul class="nav-links">
        <div class="smallscreen-search">
            <form class="search-form1">
                <input
                    type="text"
                    class="search-bar"
                    placeholder="Search Destinations"
                />
            
            </form>
        </div>
        <li><a href="homepage.html">Home</a></li>
<li><a href="homepage.html#destinations">Destinations</a></li>
<li><a href="homepage.html#about">About Pakistan</a></li>
<li><a href="signup.html">Sign Up</a></li>
      </ul>
    </nav>

    <!-- login container -->
     <div class="login-container">
        <div class="login-header">
            <h1>Continue Your Adventure</h1>
            <p>Log in to continue your journey through Pakistan.</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="yourname@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

    <script src="login.js"></script>
    <script src="common.js"></script>
</body>
</html>
