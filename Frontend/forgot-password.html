<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Discover Pakistan</title>
    <style>
        body {
            font-family: 'Lato', sans-serif;
            background-color: #f0f4f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
        }
        h2 { margin-bottom: 8px; color: #333; }
        p { color: #777; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #6b8f3e;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .msg {
            display: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .msg.success { background: #e8f8f5; color: #27ae60; display: block; }
        .msg.error { background: #ffe6e6; color: #c0392b; display: block; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Forgot Password?</h2>
        <p>Enter your email and we'll send you a reset link.</p>
        <div class="msg" id="msgBox"></div>
        <form id="forgotForm">
            <input type="email" id="email" placeholder="Your email address" required>
            <button type="submit">Send Reset Link</button>
        </form>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const msgBox = document.getElementById('msgBox');
            msgBox.style.display = 'none';

            try {
                const res = await fetch('http://localhost:3000/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                msgBox.textContent = data.message;
                msgBox.className = res.ok ? 'msg success' : 'msg error';
                msgBox.style.display = 'block';

            } catch (err) {
                msgBox.textContent = 'Something went wrong. Please try again.';
                msgBox.className = 'msg error';
                msgBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
