<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Destinations</title>
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="chatbot.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'lato', sans-serif;
            overflow-x: hidden;
               background: #e0e0e0;
        }

        .main-wrapper {
            margin-top: 120px
        }

        .main-wrapper h1 {
            margin-left: 80px;
            font-family: 'oswald', sans-serif;
            color: #9cc05a;

        }

        .card-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            padding: 50px;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .card-img-top {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-body {
            padding: 16px;
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .card-text {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 23px;
        }

        .view-btn {
            font-size: 1rem;
            padding: 0.5em 1em;
            background-color: #7ba047;
            color: white;
            border: none;
            text-decoration: none;
            cursor: pointer;
            border-radius: 4px;
        }
        .view-btn:hover{
 background: linear-gradient(135deg, #608431, #7ba047);
}

        @media (max-width: 768px) {
            .card-group {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .card-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div id="navbar"></div>

    <div class="main-wrapper">
        <h1>All Destinations</h1>
        <div class="content-wrapper">
            <div class="card-group" id="cardGroup"></div>
        </div>
    </div>


 <script src="common.js"></script>
<script>
    async function loadAllDestinations() {
        const grid = document.getElementById('cardGroup');
        try {
            const res = await fetch('http://localhost:3000/api/cities');
            const data = await res.json();

            if (!data.data || data.data.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No destinations found.</p>';
                return;
            }

            grid.innerHTML = '';
            data.data.forEach(function(dest) {
                const shortDesc = dest.description
                    ? dest.description.substring(0, 150) + (dest.description.length > 150 ? '...' : '')
                    : '';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${imgUrl(dest.hero_image)}" class="card-img-top" alt="${dest.name}">
                    <div class="card-body">
                        <h5 class="card-title">${dest.name}</h5>
                        <p class="card-text">${shortDesc}</p>
                        <a class="view-btn" href="destination.html?city=${dest.slug}">View</a>
                    </div>
                `;
                grid.appendChild(card);
            });

        } catch (e) {
            grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">Could not load destinations. Please try again.</p>';
        }
    }

    loadAllDestinations();
</script>

</body>

</html>
