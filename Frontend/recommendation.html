<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood based Recommendations</title>
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />


    
    <link rel="stylesheet" href="recommendations.css">
    <link rel="stylesheet" href="common.css">
</head>
<body>

        <div id="navbar"></div>


        <div class="container">
        <div class="selection-section">
            <h1>Get recommendations based on your mood</h1>
            <p class="subtitle">Select your travel mood and preferences to get personalized recommendations</p>

            <!-- Select Mood -->
            <div class="form-group">
                <h2>What are you in mood for?</h2>
                <div class="mood-options">
                    <label class="mood-card">
                        <input type="radio" name="mood" value="adventurous" required>
                        <div class="mood-content">
                            <span class="mood-icon">🏔️</span>
                            <span class="mood-label">Adventurous</span>
                        </div>
                    </label>

                    <label class="mood-card">
                        <input type="radio" name="mood" value="historical" required>
                        <div class="mood-content">
                            <span class="mood-icon">🏛️</span>
                            <span class="mood-label">Historical</span>
                        </div>
                    </label>

                    <label class="mood-card">
                        <input type="radio" name="mood" value="family" required>
                        <div class="mood-content">
                            <span class="mood-icon">👨‍👩‍👧‍👦</span>
                            <span class="mood-label">Family-Friendly</span>
                        </div>
                    </label>

                    <label class="mood-card">
                        <input type="radio" name="mood" value="foodie" required>
                        <div class="mood-content">
                            <span class="mood-icon">🍛</span>
                            <span class="mood-label">Foodie</span>
                        </div>
                    </label>

                    <label class="mood-card">
                        <input type="radio" name="mood" value="nature" required>
                        <div class="mood-content">
                            <span class="mood-icon">🌲</span>
                            <span class="mood-label">Nature & Peace</span>
                        </div>
                    </label>

                    <label class="mood-card">
                        <input type="radio" name="mood" value="cultural" required>
                        <div class="mood-content">
                            <span class="mood-icon">🕌</span>
                            <span class="mood-label">Cultural</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Budget Selection -->
            <div class="form-group">
                <h2>Select Your Budget</h2>
                <div class="budget-options">
                    <label class="budget-card">
                        <input type="radio" name="budget" value="budget" required>
                        <div class="budget-content">
                            <span class="budget-icon">💰</span>
                            <span class="budget-label">Budget-Friendly</span>
                            <span class="budget-range">Under 20,000 PKR</span>
                        </div>
                    </label>

                    <label class="budget-card">
                        <input type="radio" name="budget" value="moderate" required>
                        <div class="budget-content">
                            <span class="budget-icon">💵</span>
                            <span class="budget-label">Moderate</span>
                            <span class="budget-range">20,000 - 50,000 PKR</span>
                        </div>
                    </label>

                    <label class="budget-card">
                        <input type="radio" name="budget" value="luxury" required>
                        <div class="budget-content">
                            <span class="budget-icon">💎</span>
                            <span class="budget-label">Luxury</span>
                            <span class="budget-range">Above 50,000 PKR</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Duration Select -->
            <div class="form-group">
                <h2>Trip Duration (Optional)</h2>
                <div class="duration-options">
                    <label class="duration-card">
                        <input type="radio" name="duration" value="weekend">
                        <div class="duration-content">
                            <span class="duration-label">Weekend</span>
                            <span class="duration-days">2-3 days</span>
                        </div>
                    </label>

                    <label class="duration-card">
                        <input type="radio" name="duration" value="week">
                        <div class="duration-content">
                            <span class="duration-label">Week</span>
                            <span class="duration-days">5-7 days</span>
                        </div>
                    </label>

                    <label class="duration-card">
                        <input type="radio" name="duration" value="extended">
                        <div class="duration-content">
                            <span class="duration-label">Extended</span>
                            <span class="duration-days">10+ days</span>
                        </div>
                    </label>
                </div>
            </div>

            <button class="btn-get-recommendations" onclick="getRecommendations()">
                Get Recommendations
            </button>


            <!-- add saved page's link here later -->
            <a href="favourites.html" class="link-saved-destinations">
                View My Saved Destinations →
            </a>
        </div>
    </div>

    <!-- Recommendations Modal -->
    <div id="recommendationsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Your Personalized Recommendations</h2>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body" id="recommendationsContainer">
                <!-- Recommendations will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Loading icon -->
    <div id="loadingSpinner" class="loading-spinner">
        <div class="spinner"></div>
        <p>Finding perfect destinations for you...</p>
        
    </div>

    
    <script src="common.js"></script>

    
    <script>
        function getRecommendations() {
    const mood     = document.querySelector('input[name="mood"]:checked')?.value;
    const budget   = document.querySelector('input[name="budget"]:checked')?.value;
    const duration = document.querySelector('input[name="duration"]:checked')?.value;

    // mood is required
    if (!mood) {
        alert('Please select your travel mood first!');
        return;
    }

    // budget is required
    if (!budget) {
        alert('Please select your budget!');
        return;
    }

    // show loading spinner
    document.getElementById('loadingSpinner').style.display = 'flex';

    fetch('http://localhost:3000/api/cities/mood/' + mood)
        .then(function(res) { return res.json(); })
        .then(function(data) {
            document.getElementById('loadingSpinner').style.display = 'none';

            if (data.success && data.data.length > 0) {
                showResults(data.data, mood, budget);
            } else {
                showNoResults(mood);
            }
        })
        .catch(function() {
            document.getElementById('loadingSpinner').style.display = 'none';
            showError();
        });
}


function showResults(destinations, mood, budget) {
    const container = document.getElementById('recommendationsContainer');

    // build a card for each destination
    let html = '';
    destinations.forEach(function(dest) {
        html += `
            <div style="
                background:#fff;
                border-radius:10px;
                overflow:hidden;
                border:1px solid #e0e0e0;
                margin-bottom:16px;
                display:flex;
                gap:0;
                box-shadow:0 2px 8px rgba(0,0,0,0.06);
            ">
                <img
                    src="${imgUrl(dest.hero_image || dest.image) || 'images/placeholder.jpg'}"
                    alt="${dest.name}"
                    onerror="this.src='images/placeholder.jpg'"
                    style="width:140px; height:120px; object-fit:cover; flex-shrink:0;"
                >
                <div style="padding:14px; flex:1;">
                    <p style="font-size:11px; color:#7ba047; font-weight:700; text-transform:uppercase; margin:0 0 4px 0;">
                        ${dest.province || ''}
                    </p>
                    <h3 style="font-family:'Oswald',sans-serif; color:#26452d; margin:0 0 6px 0; font-size:18px;">
                        ${dest.name}
                    </h3>
                    <p style="font-size:12px; color:#666; line-height:1.5; margin:0 0 12px 0;">
                        ${dest.description ? dest.description.slice(0, 100) + '...' : ''}
                    </p>
                    <a href="destination.html?city=${dest.slug}"
                        style="
                            display:inline-block;
                            padding:6px 16px;
                            background:#7ba047;
                            color:#fff;
                            border-radius:4px;
                            text-decoration:none;
                            font-size:12px;
                            font-weight:700;
                        ">
                        View Destination →
                    </a>
                </div>
            </div>
        `;
    });

    container.innerHTML = html;

    // open the modal
    document.getElementById('recommendationsModal').style.display = 'flex';
}


function showNoResults(mood) {
    const container = document.getElementById('recommendationsContainer');
    container.innerHTML = `
        <div style="text-align:center; padding:40px 20px;">
            <div style="font-size:48px; margin-bottom:16px;">🗺️</div>
            <h3 style="font-family:'Oswald',sans-serif; color:#888; margin-bottom:8px;">
                No destinations found
            </h3>
            <p style="font-size:14px; color:#aaa;">
                No destinations found for "${mood}" mood. Try a different mood!
            </p>
        </div>
    `;
    document.getElementById('recommendationsModal').style.display = 'flex';
}


function showError() {
    const container = document.getElementById('recommendationsContainer');
    container.innerHTML = `
        <div style="text-align:center; padding:40px 20px;">
            <div style="font-size:48px; margin-bottom:16px;">⚠️</div>
            <h3 style="font-family:'Oswald',sans-serif; color:#888; margin-bottom:8px;">
                Could not connect to server
            </h3>
            <p style="font-size:14px; color:#aaa;">
                Make sure the backend server is running on port 3000.
            </p>
        </div>
    `;
    document.getElementById('recommendationsModal').style.display = 'flex';
}


function closeModal() {
    document.getElementById('recommendationsModal').style.display = 'none';
}

// close modal when clicking outside it
window.addEventListener('click', function(e) {
    const modal = document.getElementById('recommendationsModal');
    if (e.target === modal) {
        modal.style.display = 'none';
    }
});
    </script>

    
</body>
</html>
