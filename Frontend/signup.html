<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
     <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="common.css" />
</head>
<body>
    <div id="navbar"></div>
    <!-- sign up container -->
    <div class="signup-container">
        <div class="signup-header">
            <h1>Join the Adventure</h1>
            <p>Create an account to start planning your journey through Pakistan.</p>
        </div>

        <form id="signupForm">
            <div class="form-group">
    <label for="fullName">Full Name</label>
    <input type="text" id="fullName" placeholder="e.g., salar sikandar" required>
    <span class="error-message" id="nameError">Please enter your name</span>
</div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="yourname@gmail.com" required>
                <span class="error-message" id="emailError">Please enter a valid email</span>
            </div>


            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Create a secure password" required>
                    <span class="toggle-password" onclick="togglePassword('password', this)">👁️</span>
                <span class="error-message" id="passwordError">Password must be at least 6 characters</span>
            </div>

            <button type="submit" class="signup-btn">Sign Up</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script src="signup.js"></script>
    <script src="common.js"></script>
</body>
</html>
